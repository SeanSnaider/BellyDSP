# Pinned binary dependencies that aren't git submodules: the auto-update frameworks. Read by
# tools/fetch_deps.sh (macOS), .github/workflows/windows.yml (Windows), and CMakeLists.txt.
# To upgrade one: change the version, download the release file and run `shasum -a 256` on it (compare
# with the "digest" GitHub shows for the asset), check the release notes, and add a line to BUILD_PLAN's decision log.

# Sparkle 2 (macOS updates): https://github.com/sparkle-project/Sparkle/releases
SPARKLE_VERSION=2.10.0
SPARKLE_SHA256=c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

# WinSparkle (Windows updates): https://github.com/vslavik/winsparkle/releases
WINSPARKLE_VERSION=0.9.4
WINSPARKLE_SHA256=6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976

# NAM's standard training input file, v3.0.0 (input.wav, 190 s, 48 kHz, 24-bit mono), for capturing gear
# (docs/CAPTURING.md; tools/fetch_nam_input.sh). The link is the one neural-amp-modeler's own trainer GUI
# offers (nam/train/gui/__init__.py, 0.12.3 and 0.13.0). NAM_INPUT_MD5 is the "strong hash" the trainer
# itself recognises as v3.0.0 (nam/train/core.py). No licence is stated for the file, so it's downloaded
# on each machine and never committed or shipped.
NAM_INPUT_URL=https://drive.usercontent.google.com/download?id=1KbaS4oXXNEuh2aCPLwKrPdf5KFOjda8G&export=download&confirm=t
NAM_INPUT_SHA256=70f8ec7f25686a1bd77f25973de8e51a6721e957e81eec121822e5e53366bc41
NAM_INPUT_MD5=36cd1af62985c2fac3e654333e36431e

# NAM's trainer, run through uv by tools/train_capture.sh. 0.12.3 (April 2026), the last version with the
# standard / lite / feather / nano WaveNet choices; 0.13.0 (June 2026) dropped them and always trains one
# "packed" slimmable model (docs/ASSUMPTIONS.md DS30). To upgrade: change this, train a test capture, and
# check it loads and renders (docs/CAPTURING.md), then add a line to BUILD_PLAN's decision log.
NAM_TRAINER_VERSION=0.12.3
