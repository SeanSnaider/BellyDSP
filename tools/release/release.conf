# Release settings, in one place. Read by the release scripts (tools/release/lib.sh), by CMakeLists.txt, and by the
# Windows CI workflow. Values are plain KEY=VALUE with no spaces around "=".

# The public GitHub repo (owner/name): BellyDSP's source ("prod", the git remote named `public`) and its
# releases. People download from its Releases page, and the apps check its latest release for
# appcast.xml (macOS) and appcast-windows.xml (Windows). docs/RELEASING.md: the dev -> public -> tag ->
# release flow, and why every binary is built from a commit that's on this repo and tagged (the AGPL).
RELEASES_REPO=SeanSnaider/BellyDSP

# The Ed25519 public key that every installed copy uses to check updates (Sparkle's SUPublicEDKey,
# WinSparkle's EdDSA key). Public, so it's safe to commit. Empty until the one-time setup in
# docs/RELEASING.md: run `build-deps/Sparkle-2.10.0/bin/generate_keys` and paste the key it prints.
# Changing it after the first release means installed copies can no longer update.
ED_PUBLIC_KEY=

# The name of the self-signed code-signing certificate (tools/release/make_signing_identity.sh).
# Set AMPSIM_SIGN_IDENTITY to a "Developer ID Application: ..." identity to use a real one instead.
SIGN_IDENTITY_NAME=BellyDSP Self-Signed (Sean Snaider)

# How JUCE is licensed for the builds you hand out: AGPLv3 (decided 2026-10-03: BellyDSP is free software
# under AGPL-3.0-or-later, LICENSE). Goes into the notices; the release script also accepts "JUCE" (the
# JUCE 8 licence) and refuses "undecided".
JUCE_LICENCE=AGPLv3

# Where anyone who gets the app can get its complete source, as the AGPL requires. The brand menu's
# "Source code for this version" opens <SOURCE_URL>/tree/v<version>.
SOURCE_URL=https://github.com/SeanSnaider/BellyDSP
