# Release settings, in one place. Read by the release scripts (tools/release/lib.sh), by CMakeLists.txt, and by the
# Windows CI workflow. Values are plain KEY=VALUE with no spaces around "=".

# The public, releases-only GitHub repo (owner/name). Friends download from its Releases page, and the
# apps check its latest release for appcast.xml (macOS) and appcast-windows.xml (Windows).
RELEASES_REPO=SeanSnaider/amp-sim-releases

# The Ed25519 public key that every installed copy uses to check updates (Sparkle's SUPublicEDKey,
# WinSparkle's EdDSA key). Public, so it's safe to commit. Empty until the one-time setup in
# docs/RELEASING.md: run `build-deps/Sparkle-2.10.0/bin/generate_keys` and paste the key it prints.
# Changing it after the first release means installed copies can no longer update.
ED_PUBLIC_KEY=

# The name of the self-signed code-signing certificate (tools/release/make_signing_identity.sh).
# Set AMPSIM_SIGN_IDENTITY to a "Developer ID Application: ..." identity to use a real one instead.
SIGN_IDENTITY_NAME=Amp Sim Self-Signed (Sean Snaider)

# How JUCE is licensed for the builds you hand out: undecided, AGPLv3, or JUCE (docs/RELEASING.md,
# "Licences"). A real release refuses to run while it's undecided. It also goes into the notices.
JUCE_LICENCE=undecided

# Where anyone who gets the app can get its complete source (needed if JUCE_LICENCE is AGPLv3).
SOURCE_URL=
