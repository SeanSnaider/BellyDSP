# The macOS test suite on GitHub's runners: a check that the repo builds and passes from a fresh
# clone, independent of Sean's Mac. Releases are still built on Sean's Mac (tools/release/release.sh),
# because they're signed with his keys.
#
# UNTESTED: it can't run until the repo is pushed to GitHub.
#
# This file lives in both repos (docs/RELEASING.md). It runs only by hand on both (see "on:" below).

name: macOS tests

# Manual only (Actions tab > macOS tests > Run workflow), on both repos: every change already runs the full
# suite on Sean's Mac before it's pushed, and the runner took 42 minutes for the same check (2026-10-05).
on:
  workflow_dispatch:

# A newer push cancels this workflow's older run on the same branch, so two builds never compete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Automatic runs only on the public repo; by hand anywhere.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out (submodules come next, cached and retried)
        uses: actions/checkout@v4

      - name: Submodule cache key (the pinned commits)
        id: subkey
        shell: bash
        run: echo "key=submodules-${{ runner.os }}-$(git ls-tree -r HEAD third_party | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the submodules from the cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            third_party
          key: ${{ steps.subkey.outputs.key }}

      - name: Fetch the submodules (with retries; Eigen's host, gitlab.com, can be overloaded)
        shell: bash
        run: tools/ci/fetch_submodules.sh

      - name: "Configure (native arm64, no updater: the dev configuration)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 3 # the runner's 3 cores; an unbounded -j with LTO swaps on its 7 GB

      - name: Test
        env:
          AMPSIM_CPU_BUDGET_SCALE: "4" # shared runners are several times slower than a dev Mac (tests/TestHelpers.h)
          # Skipped here, by a substring of "<test> / <subtest>" (tests/TestMain.cpp), and only checks of wall-clock
          # pacing that a starved shared runner can't hold (ASSUMPTIONS DS54):
          #   "TunerThread pacing"  the tuner's analysis thread delivering about 60 readings a second in real time.
          #                         Its correctness on the same run (live, in tune, never torn) still runs.
          #   The five slowest groups, about 33 of the 42 minutes the full suite took on the macOS runner (measured
          #   2026-10-05 from the runner's per-test times). They run in full on Sean's Mac before every push and on
          #   his Windows PC before a release (docs/RELEASING.md):
          #   "Amp gain"                gain-set sweeps and listening renders (11 min on a runner)
          #   "Gain staging"            level audits rendering every block (6 min)
          #   "Tone match"              all four tone match groups: matching and separation runs (11 min)
          #   "Cab normalization study" a study, not a check (1.6 min)
          #   "Full rig"                a CPU benchmark of the whole rig (a shared runner can't judge CPU)
          AMPSIM_SKIP_TESTS: "TunerThread pacing;Amp gain;Gain staging;Tone match;Cab normalization study;Full rig"
        run: ctest --test-dir build --output-on-failure -V

      - name: Keep the proof (measurements, renders, editor snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: build/proof
