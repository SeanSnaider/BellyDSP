# The macOS test suite on GitHub's runners: a check that the repo builds and passes from a fresh
# clone, independent of Sean's Mac. Releases are still built on Sean's Mac (tools/release/release.sh),
# because they're signed with his keys.
#
# UNTESTED: it can't run until the repo is pushed to GitHub.
#
# This file lives in both repos (docs/RELEASING.md). On the public SeanSnaider/BellyDSP it runs on every
# push and pull request (standard runners are free for public repos). On the private dev repo only by
# hand (Actions tab > macOS tests > Run workflow): there, macOS minutes count ten times against GitHub's
# free allowance (2,000 a month on the Free plan), so a 20-minute run costs about 200 of them
# (ASSUMPTIONS DS40).

name: macOS tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Automatic runs only on the public repo; by hand anywhere.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Configure (native arm64, no updater: the dev configuration)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -V

      - name: Keep the proof (measurements, renders, editor snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: build/proof
