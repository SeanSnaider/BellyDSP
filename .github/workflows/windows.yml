# The Windows build: compiles Amp Sim with MSVC, runs the test suite, builds the Inno Setup installer,
# signs it for WinSparkle, and (for a release tag) adds it to the GitHub release in the public releases
# repo. docs/RELEASING.md explains the setup.
#
# UNTESTED: it can't run until the repo is pushed to GitHub, and nothing here has been compiled on
# Windows yet. Expect the first run to need fixes.
#
# When it runs: on a pushed release tag (v1.2.3, which release.sh creates) and by hand (Actions tab >
# Windows build > Run workflow). Not on every push: the source repo is private, and Windows minutes count
# double against GitHub's free allowance (2,000 a month on the Free plan), at roughly 30 to 45 minutes
# a build.
#
# Secrets (Settings > Secrets and variables > Actions), both optional:
#   AMPSIM_ED_PRIVATE_KEY  the Ed25519 private key (the one-line file `generate_keys -x` writes). Signs the
#                          installer here. Without it, sign it on your Mac instead: tools/release/add_windows.sh.
#   RELEASES_TOKEN         a fine-grained token with Contents: read and write on the public releases repo.
#                          Lets a tag build upload the installer and appcast-windows.xml to the release.

name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build (default: the VERSION file)"
        type: string
        default: ""
      asio:
        description: "Build with ASIO support (read the licensing note in docs/RELEASING.md first)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # Whether the signing key secret exists (a step's `if` can't read secrets directly).
      HAS_ED_KEY: ${{ secrets.AMPSIM_ED_PRIVATE_KEY != '' }}
    steps:
      - name: Check out (with JUCE and NeuralAmpModelerCore)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read the pinned versions and release settings
        id: conf
        shell: bash
        run: |
          get() { sed -n "s/^$1=//p" "$2" | tail -n 1 | tr -d '\r'; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then version="${{ inputs.version }}"
          else version="$(tr -d '\r\n' < VERSION)"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "winsparkle_version=$(get WINSPARKLE_VERSION tools/deps.conf)" >> "$GITHUB_OUTPUT"
          echo "winsparkle_sha256=$(get WINSPARKLE_SHA256 tools/deps.conf)" >> "$GITHUB_OUTPUT"
          echo "releases_repo=$(get RELEASES_REPO tools/release/release.conf)" >> "$GITHUB_OUTPUT"
          key="$(get ED_PUBLIC_KEY tools/release/release.conf)"
          echo "ed_public_key=$key" >> "$GITHUB_OUTPUT"
          echo "juce_licence=$(get JUCE_LICENCE tools/release/release.conf)" >> "$GITHUB_OUTPUT"
          echo "source_url=$(get SOURCE_URL tools/release/release.conf)" >> "$GITHUB_OUTPUT"
          if [ -n "$key" ]; then echo "updater=ON" >> "$GITHUB_OUTPUT"; else
            echo "updater=OFF" >> "$GITHUB_OUTPUT"
            echo "::warning::ED_PUBLIC_KEY is empty in tools/release/release.conf: building without the updater"
          fi
          echo "Building Amp Sim $version"

      - name: Fetch WinSparkle (pinned, SHA-256 checked)
        shell: pwsh
        run: |
          $v = "${{ steps.conf.outputs.winsparkle_version }}"
          Invoke-WebRequest -Uri "https://github.com/vslavik/winsparkle/releases/download/v$v/WinSparkle-$v.zip" -OutFile winsparkle.zip
          $hash = (Get-FileHash winsparkle.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ steps.conf.outputs.winsparkle_sha256 }}") { throw "WinSparkle SHA-256 mismatch: got $hash" }
          New-Item -ItemType Directory -Force build-deps | Out-Null
          Expand-Archive winsparkle.zip -DestinationPath build-deps -Force
          Get-ChildItem "build-deps/WinSparkle-$v"

      - name: Configure (Visual Studio 2022, x64)
        shell: bash
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 \
            -DAMPSIM_VERSION="${{ steps.conf.outputs.version }}" \
            -DAMPSIM_UPDATER=${{ steps.conf.outputs.updater }} \
            -DAMPSIM_ED_PUBLIC_KEY="${{ steps.conf.outputs.ed_public_key }}" \
            -DAMPSIM_WITH_ASIO=${{ inputs.asio && 'ON' || 'OFF' }} \
            -DAMPSIM_JUCE_LICENCE="${{ steps.conf.outputs.juce_licence }}" \
            -DAMPSIM_SOURCE_URL="${{ steps.conf.outputs.source_url }}"

      - name: Build
        run: cmake --build build-release --config Release --parallel

      - name: Test (the full suite)
        run: ctest --test-dir build-release -C Release --output-on-failure -V

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $src = (Resolve-Path "build-release/AmpSim_artefacts/Release/Standalone").Path
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=${{ steps.conf.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$((Resolve-Path dist).Path)" installer\windows\AmpSim.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Sign the installer for WinSparkle and write appcast-windows.xml
        if: ${{ env.HAS_ED_KEY == 'true' && steps.conf.outputs.updater == 'ON' }}
        env:
          ED_PRIVATE_KEY: ${{ secrets.AMPSIM_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          v="${{ steps.conf.outputs.version }}"
          setup="dist/AmpSim-$v-windows-setup.exe"
          sig="$(printf '%s' "$ED_PRIVATE_KEY" | python tools/release/ed25519.py sign - "$setup")"
          python tools/release/ed25519.py verify "${{ steps.conf.outputs.ed_public_key }}" "$setup" "$sig"
          notes=(); [ -f "release-notes/$v.md" ] && notes=(--notes "release-notes/$v.md")
          python tools/release/make_appcast.py --platform windows --version "$v" --file "$setup" \
            --url "https://github.com/${{ steps.conf.outputs.releases_repo }}/releases/download/v$v/$(basename "$setup")" \
            --signature "$sig" --repo "${{ steps.conf.outputs.releases_repo }}" --out dist/appcast-windows.xml "${notes[@]}"

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmpSim-${{ steps.conf.outputs.version }}-windows
          path: |
            dist/AmpSim-*-windows-setup.exe
            dist/appcast-windows.xml
          if-no-files-found: error

  publish:
    # Only for release tags, and only when the secrets exist (otherwise: release.sh --windows-dir).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: windows
          merge-multiple: true
      - name: Add the Windows files to the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo "::warning::No RELEASES_TOKEN secret: download the artifact and run tools/release/add_windows.sh instead"; exit 0; fi
          if [ ! -f windows/appcast-windows.xml ]; then echo "::warning::The installer wasn't signed (no AMPSIM_ED_PRIVATE_KEY): run tools/release/add_windows.sh on the Mac"; exit 0; fi
          ls -la windows
          tools/release/github_release.sh "$GITHUB_REF_NAME" - windows/AmpSim-*-windows-setup.exe windows/appcast-windows.xml
